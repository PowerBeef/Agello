# MobileBuildMCP project config. Copy to config.yaml (git-ignored) and set
# your iPhone's UDID (`xcrun devicectl list devices`). config.yaml is also
# read by scripts/device-harness.sh to pick the default device.
schemaVersion: 1

# Physical iPhone only (see AGENTS.md): the simulator has no Metal path for
# LiteRT-LM, so its workflows stay off. `device` includes project discovery,
# schemes, build settings, clean, and coverage; session tools are always on.
# (`debugging` is left out: it only attaches to simulators.)
enabledWorkflows: ["device"]

# Default profile: build/run on the iPhone in Release (real performance).
sessionDefaults:
  projectPath: "./iRTChat.xcodeproj"
  scheme: "iRTChat"
  deviceId: "<your-iphone-udid>"
  # Debug builds of the LiteRT-LM path are misleadingly slow for inference.
  configuration: "Release"

sessionDefaultsProfiles:
  # On-device test harness (iRTChatDeviceTests + iRTChatUITests). Tests need
  # Debug: `@testable import` requires testability. The heavy inference runs
  # in the prebuilt, optimized LiteRT-LM binary either way.
  # Switch with session_use_defaults_profile({ profile: "device-tests" }).
  device-tests:
    projectPath: "./iRTChat.xcodeproj"
    scheme: "iRTChat"
    deviceId: "<your-iphone-udid>"
    configuration: "Debug"
